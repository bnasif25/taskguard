---
# HorizontalPodAutoscaler — automatically scales pods based on load.
# minReplicas = 2: never drop below 2 (high availability).
# maxReplicas = 10: ceiling to prevent runaway scaling.
# metrics: scale when CPU > 70% OR memory > 80%.
# behavior: fast scale-up (0s stabilization), slow scale-down (5min stabilization).
#   This prevents flapping — adding and removing pods rapidly.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: taskguard
  namespace: taskguard
  labels:
    app.kubernetes.io/name: taskguard
    app.kubernetes.io/component: autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: taskguard
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
