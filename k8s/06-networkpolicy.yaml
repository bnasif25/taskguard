---
# NetworkPolicy — default-deny with explicit allow rules.
# Without a NetworkPolicy, ALL pods in the cluster can talk to this pod.
# This manifest restricts ingress to:
#   1. The monitoring namespace (Prometheus scraping)
#   2. Intra-namespace traffic (for clients/debugging)
# Egress is unrestricted. The current app makes no outbound requests.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: taskguard-ingress-lockdown
  namespace: taskguard
  labels:
    app.kubernetes.io/name: taskguard
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: taskguard
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    # Rule 1: Allow Prometheus scraping from the monitoring namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080

    # Rule 2: Allow intra-namespace traffic.
    # Useful for debug sidecars or future service mesh.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: taskguard
      ports:
        - protocol: TCP
          port: 8080
