---
# PrometheusRule — defines alerting rules based on scraped metrics.
# Requires the Prometheus Operator.
# These rules are evaluated every 15s (default evaluation interval).
# When a rule fires, Prometheus sends the alert to Alertmanager.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: taskguard-alerts
  namespace: taskguard
  labels:
    app.kubernetes.io/name: taskguard
    app.kubernetes.io/component: monitoring
    release: prometheus
spec:
  groups:
    - name: taskguard
      rules:
        # Alert: High error rate
        # If more than 5% of requests return 5xx in 5 minutes, page someone.
        - alert: TaskGuardHighErrorRate
          expr: |
            sum by (namespace) (rate(taskguard_http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum by (namespace) (rate(taskguard_http_requests_total[5m])), 0.001) > 0.05
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "TaskGuard high error rate"
            description: "More than 5% of requests are failing in namespace {{ $labels.namespace }}."

        # Alert: High latency
        # If 95th percentile latency exceeds 200ms for 5 minutes, warn.
        - alert: TaskGuardHighLatency
          expr: |
            histogram_quantile(0.95,
              sum by (namespace, le) (rate(taskguard_http_request_duration_seconds_bucket[5m]))
            ) > 0.2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "TaskGuard high latency"
            description: "95th percentile latency is above 200ms."

        # Alert: Pod crash looping
        # If a pod restarts more than 3 times in 10 minutes, it's unhealthy.
        - alert: TaskGuardCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="taskguard"}[10m]) > 3
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "TaskGuard pod crash looping"
            description: "Pod {{ $labels.pod }} is restarting frequently."
