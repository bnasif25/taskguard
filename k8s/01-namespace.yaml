---
apiVersion: v1
kind: Namespace
metadata:
  name: taskguard
  labels:
    app.kubernetes.io/name: taskguard
    app.kubernetes.io/part-of: taskguard
    # Pod Security Standards: enforce the 'restricted' profile.
    # This prevents pods from running as root, mounting host paths,
    # or using privileged containers.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
