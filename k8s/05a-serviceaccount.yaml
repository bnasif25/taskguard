---
# ServiceAccount with minimal RBAC.
# The pod runs as this ServiceAccount instead of 'default'.
# In production, you would bind a Role with specific permissions.
# For this demo, we create the SA but keep it unbound (no API access needed).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: taskguard
  namespace: taskguard
  labels:
    app.kubernetes.io/name: taskguard
    app.kubernetes.io/component: rbac
automountServiceAccountToken: false
