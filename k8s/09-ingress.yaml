---
# Ingress — exposes the Service to the internet via an Ingress Controller.
# The Ingress Controller (e.g. nginx) reads this resource and configures itself.
# This local-lab Ingress uses HTTP only. Production needs real DNS and TLS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskguard
  namespace: taskguard
  labels:
    app.kubernetes.io/name: taskguard
    app.kubernetes.io/component: ingress
  annotations:
    # Rate limiting: 10 requests per second per IP
    nginx.ingress.kubernetes.io/limit-rps: "10"
spec:
  # Use the nginx ingress controller.
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: taskguard
                port:
                  number: 8080
